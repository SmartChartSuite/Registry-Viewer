@if(searchType == SearchTypeEnum.PATIENT_SEARCH){
  <app-patient-search-results
    [searchResults]="searchResults"
    [dataFilter]="filterStr"
    (onPatientSelectedEvent)="patientSelected($event)">
  </app-patient-search-results>
}
@else if(searchType == SearchTypeEnum.QUERY_DATA){
  <app-query-search-results [searchResults]="searchResults"></app-query-search-results>
}
