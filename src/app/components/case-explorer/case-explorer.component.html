<div class="generic-component-wrapper" *ngIf="oauthService.hasValidAccessToken; else loggedout">
  <div class="generic-component-content container">
    <mat-tab-group mat-stretch-tabs="false" mat-align-tabs="start">

      <mat-tab [label]="searchType.PATIENT_SEARCH">
        <div class="padding-top-lg search-container">
          <div class="search">
            <app-search-form
              [searchType]="searchType.PATIENT_SEARCH"
              (onSearchEvent)="onSearchEvent($event)"
              (onFilterSearchResultsEvent)="onFilterSearchResults($event)"
              (onApiOptionsChangeEvent)="onApiOptionsChangeEvent($event)"
            >
            </app-search-form>
            <app-common-search-results
              [searchType]="searchType.PATIENT_SEARCH"
              [patientSearchResults]="patientSearchResults"
              [filterStr]="filterStr"
              [selectedRegistrySchema]="selectedRegistrySchema"
            ></app-common-search-results>
          </div>
        </div>
      </mat-tab>

      <mat-tab [label]="searchType.POPULATION_SEARCH">
        <div class="padding-top-lg search-container">
          <div>
            <app-search-history [searchHistory]="searchHistory" (onSearchHistorySelected)="onSearchHistorySelected($event)"></app-search-history>
          </div>
          <div class="search">
            <app-search-form
              [searchType]="searchType.POPULATION_SEARCH"
              (onSearchEvent)="onSearchEvent($event)"
              (onFilterSearchResultsEvent)="onFilterSearchResults($event)"
            >
            </app-search-form>
            <app-common-search-results
              [searchType]="searchType.POPULATION_SEARCH"
              [populationSearchResults]="populationSearchResults"
              [selectedRegistrySchema]="selectedRegistrySchema"
            ></app-common-search-results>
          </div>
        </div>
      </mat-tab>
    </mat-tab-group>
  </div>


</div>

<ng-template #loggedout>
  Please login to access this application.
</ng-template>
