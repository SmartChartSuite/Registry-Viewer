<form [formGroup]="searchForm" (submit)="onSearch()">
  <div class="search-bar">
    <div class="search-input">
      <mat-form-field appearance="outline" class="query-search">
        <mat-label>Search Query</mat-label>
        <input matInput type="text" formControlName="query">
        <button matSuffix mat-icon-button aria-label="Clear Search Query" (click)="searchForm.reset()">
          <mat-icon matTooltip="Clear Search Query" matSuffix>cancel</mat-icon>
        </button>
      </mat-form-field>
    </div>
    <div class="search-actions">
      <button class="search-button" mat-raised-button color="primary" type="submit">
        <mat-icon>search</mat-icon>
        Search
      </button>
    </div>
  </div>
</form>
<div>
  <app-llm-search-results [searchResults]="searchResults"></app-llm-search-results>
</div>
